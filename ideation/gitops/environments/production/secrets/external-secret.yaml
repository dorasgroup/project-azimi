apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: provider-api-keys
  namespace: application
spec:
  refreshInterval: "1h"
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore
  target:
    name: provider-api-keys-secret # The name of the resulting Kubernetes Secret
    creationPolicy: Owner
  data:
  - secretKey: AVALAI_API_KEY
    remoteRef:
      key: prod/ai-platform/avalai
      property: api_key
  - secretKey: OPENAI_API_KEY
    remoteRef:
      key: prod/ai-platform/openai
      property: api_key
