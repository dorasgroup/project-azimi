global:
  scrape_interval: 15s

scrape_configs:
  - job_name: 'core-api'
    static_configs:
      - targets: ['core-api:8000']
  
  - job_name: 'ai-gateway'
    static_configs:
      - targets: ['ai-gateway:3000']
      
  - job_name: 'rabbitmq'
    static_configs:
      - targets: ['rabbitmq:15692']
