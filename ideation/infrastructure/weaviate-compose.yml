version: '3.8'

services:
  weaviate:
    image: semitechnologies/weaviate:1.24.4
    ports:
      - "8080:8080"
      - "50051:50051"
    volumes:
      - weaviate_data:/var/lib/weaviate
    environment:
      - QUERY_DEFAULTS_LIMIT=25
      - AUTHENTICATION_ANONYMOUS_ACCESS_ENABLED=false
      - AUTHENTICATION_APIKEY_ENABLED=true
      - AUTHENTICATION_APIKEY_ALLOWED_KEYS=${WEAVIATE_API_KEY:-your_secure_weaviate_key}
      - AUTHENTICATION_APIKEY_USERS=admin
      - PERSISTENCE_DATA_PATH=/var/lib/weaviate
      - DEFAULT_VECTORIZER_MODULE=none
      - ENABLE_MODULES=backup-s3
      - BACKUP_S3_BUCKET=${S3_BUCKET_WEAVIATE_BACKUP:-weaviate-backups}
      - BACKUP_S3_ENDPOINT=minio:9000
      - BACKUP_S3_ACCESS_KEY_ID=${MINIO_ACCESS_KEY:-minioadmin}
      - BACKUP_S3_SECRET_ACCESS_KEY=${MINIO_SECRET_KEY:-minioadmin123}
      - BACKUP_S3_USE_SSL=false
      - CLUSTER_HOSTNAME=node1
      - LIMIT_RESOURCES=true
      - GOMEMLIMIT=4096MiB
    networks:
      - data-net
      - ai-net

volumes:
  weaviate_data:
    driver: local

networks:
  data-net:
    external: true
  ai-net:
    external: true
