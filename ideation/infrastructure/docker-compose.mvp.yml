version: '3.8'

services:
  # ----------------------------------------------------
  # 1. CORE BUSINESS SERVICES
  # ----------------------------------------------------
  api-gateway:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - core-api
      - ai-gateway

  core-api:
    build:
      context: ./core-api
      dockerfile: Dockerfile
    environment:
      - NODE_ENV=production
      - DB_HOST=postgres
      - DB_USER=core_user
      - DB_PASS=${DB_PASS:-secret}
      - RABBITMQ_URL=amqp://guest:guest@rabbitmq:5672
      - S3_ENDPOINT=http://minio:9000
    depends_on:
      - postgres
      - rabbitmq
      - minio

  ai-gateway:
    build:
      context: ./ai-gateway
      dockerfile: Dockerfile
    environment:
      - NODE_ENV=production
      - REDIS_URL=redis://redis:6379
      - DIFY_API_URL=http://dify-api:5001
      - AVALAI_API_KEY=${AVALAI_API_KEY}
    depends_on:
      - redis
      - dify-api

  ingestion-worker:
    build:
      context: ./ingestion-worker
      dockerfile: Dockerfile
    environment:
      - RABBITMQ_URL=amqp://guest:guest@rabbitmq:5672
      - WEAVIATE_URL=http://weaviate:8080
      - S3_ENDPOINT=http://minio:9000
    depends_on:
      - rabbitmq
      - weaviate
      - minio

  # ----------------------------------------------------
  # 2. DATA PLATFORM & INFRASTRUCTURE
  # ----------------------------------------------------
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: core_user
      POSTGRES_PASSWORD: ${DB_PASS:-secret}
      POSTGRES_DB: core_db
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data

  rabbitmq:
    image: rabbitmq:3-management-alpine
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - mq_data:/var/lib/rabbitmq

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: ${MINIO_PASS:-admin1234}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  weaviate:
    image: semitechnologies/weaviate:1.24.4
    ports:
      - "8080:8080"
      - "50051:50051"
    environment:
      QUERY_DEFAULTS_LIMIT: 25
      AUTHENTICATION_ANONYMOUS_ACCESS_ENABLED: 'true'
      PERSISTENCE_DATA_PATH: '/var/lib/weaviate'
      ENABLE_MODULES: 'text2vec-openai,generative-openai'
      CLUSTER_HOSTNAME: 'node1'
    volumes:
      - weaviate_data:/var/lib/weaviate

  # ----------------------------------------------------
  # 3. AI ORCHESTRATION (Dify)
  # ----------------------------------------------------
  dify-api:
    image: langgenius/dify-api:latest
    environment:
      - WEAVIATE_ENDPOINT=http://weaviate:8080
      - REDIS_HOST=redis
      - DB_HOST=postgres
    depends_on:
      - weaviate
      - postgres
      - redis

volumes:
  pg_data:
  mq_data:
  minio_data:
  weaviate_data:
