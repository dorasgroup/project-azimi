worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/json;
    server_tokens off;
    
    log_format json_combined escape=json
      '{"time_local":"$time_local","remote_ip":"$remote_addr",'
      '"request_id":"$request_id","request":"$request",'
      '"status":"$status","body_bytes_sent":"$body_bytes_sent",'
      '"request_time":"$request_time","upstream_response_time":"$upstream_response_time"}';
      
    access_log /var/log/nginx/access.log json_combined;

    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=100r/m;
    limit_req_zone $binary_remote_addr zone=chat_limit:10m rate=20r/m;

    upstream core_api {
        server core-api:8000;
    }

    server {
        listen 80;
        server_name localhost;

        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        
        proxy_intercept_errors on;
        error_page 404 429 502 503 504 /gateway_error;

        location = /gateway_error {
            internal;
            return 502 '{"success":false,"message":"Gateway Error","traceId":"$request_id"}';
        }

        # The web chat uses the authenticated Core API endpoint. Keep this
        # exact route ahead of the generic AI Gateway chat namespace.
        location = /api/v1/chat/messages {
            proxy_pass http://core-api:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Request-ID $request_id;
        }

        # Chat history is account-scoped and persisted by the Core API.
        location ^~ /api/v1/chat/history {
            proxy_pass http://core-api:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Request-ID $request_id;
        }

        # Document uploads are sent through the Core API. Match the 500 MB
        # limit advertised by the UI and stream the request so Nginx does not
        # buffer the complete document before forwarding it.
        location ^~ /api/v1/uploads {
            client_max_body_size 500M;
            proxy_request_buffering off;
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;

            proxy_pass http://core-api:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Request-ID $request_id;
        }


        location /api/ {
            location /api/v1/chat/ {
                proxy_pass http://ai-gateway:3000;
                
                proxy_http_version 1.1;
                proxy_set_header Connection '';
                proxy_buffering off;
                proxy_cache off;
                chunked_transfer_encoding on;
                
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Request-ID $request_id;
            }

            proxy_pass http://core-api:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Request-ID $request_id;
        }

        # MinIO Direct Upload Route (Presigned URLs via Core API route to MinIO port 9000)
        location /storage/ {
            proxy_pass http://minio:9000/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            
            # Allow large uploads for documents
            client_max_body_size 100M;
        }

        location /health/live {
            access_log off;
            return 200 '{"status":"UP"}';
        }
    }
}
