global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    environment: production
    service_group: ideation

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  - job_name: ideation-backend
    metrics_path: /metrics
    static_configs:
      - targets:
          - backend:8000

  - job_name: prometheus
    static_configs:
      - targets:
          - 127.0.0.1:9090
  - job_name: rabbitmq
    metrics_path: /metrics
    static_configs:
      - targets:
          - rabbitmq:15692
  - job_name: ingestion-worker
    metrics_path: /metrics
    static_configs:
      - targets:
          - ingestion-worker:9100
