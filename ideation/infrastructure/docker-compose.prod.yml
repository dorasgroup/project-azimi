services:
  postgres:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ideation_rag}
      POSTGRES_USER: ${POSTGRES_USER:-ideation_rag}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ideation_rag} -d ${POSTGRES_DB:-ideation_rag}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ../backend
    restart: unless-stopped
    env_file:
      - ./.env
      - ./haminyar-articles.env
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      ENABLE_PROTOTYPE_ROUTES: "false"
      ASYNC_INGESTION_ENABLED: ${ASYNC_INGESTION_ENABLED:-false}
      BALE_INTEGRATION_ENABLED: ${BALE_INTEGRATION_ENABLED:-false}
      BALE_CONTENT_UPLOAD_ENABLED: ${BALE_CONTENT_UPLOAD_ENABLED:-false}
      BALE_FILE_UPLOAD_MAX_MB: ${BALE_FILE_UPLOAD_MAX_MB:-20}
      BALE_BOT_TOKEN_FILE: /run/secrets/bale_bot_token
      BALE_WEBHOOK_SECRET_FILE: /run/secrets/bale_webhook_secret
      BALE_INTEGRATION_USER_ID: ${BALE_INTEGRATION_USER_ID:-}
      GUEST_ACCESS_TOKEN_FILE: /run/secrets/guest_access_token
      GUEST_ACCESS_USER_ID: ${GUEST_ACCESS_USER_ID:-}
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-ideation_rag}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-ideation_rag}
      LOG_DIR: /app/storage/logs
      UPLOAD_STORAGE_PATH: /app/storage/uploads
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:?CORS_ALLOWED_ORIGINS is required}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: "5672"
      RABBITMQ_USER: ideation_ingestion
      RABBITMQ_VHOST: ideation
      RABBITMQ_PASSWORD_FILE: /run/secrets/rabbitmq_password
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ../storage:/app/storage
    secrets:
      - rabbitmq_password
      - bale_bot_token
      - bale_webhook_secret
      - guest_access_token
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health/live', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  rabbitmq:
    image: rabbitmq@sha256:606d8c0d6b3c18d1da9afc53bc7cdb2a8d5486df91b5a9830e9e07626c9ae281
    hostname: ideation-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_SERVER_ADDITIONAL_ERL_ARGS: >-
        -rabbit vm_memory_high_watermark 0.40 disk_free_limit 1073741824
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - >-
        password="$$(cat /run/secrets/rabbitmq_password)";
        printf 'default_user = ideation_ingestion\ndefault_pass = %s\ndefault_vhost = ideation\n'
        "$$password" > /etc/rabbitmq/conf.d/20-ideation-defaults.conf;
        unset password;
        exec docker-entrypoint.sh rabbitmq-server
    secrets:
      - rabbitmq_password
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
      - ./rabbitmq/enabled_plugins:/etc/rabbitmq/enabled_plugins:ro
    healthcheck:
      test: ["CMD-SHELL", "su-exec rabbitmq rabbitmq-diagnostics -q ping"]
      interval: 60s
      timeout: 30s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 512M
        reservations:
          cpus: "0.10"
          memory: 128M

  ingestion-worker:
    build:
      context: ../backend
    restart: unless-stopped
    command: ["python", "-m", "app.ingestion.worker_entrypoint"]
    stop_grace_period: 3m
    env_file:
      - ./.env
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      SERVICE_NAME: ingestion-worker
      ASYNC_INGESTION_ENABLED: "true"
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-ideation_rag}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-ideation_rag}?ssl=disable
      LOG_DIR: /tmp/ideation-worker-logs
      UPLOAD_STORAGE_PATH: /app/storage/uploads
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:?CORS_ALLOWED_ORIGINS is required}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: "5672"
      RABBITMQ_USER: ideation_ingestion
      RABBITMQ_VHOST: ideation
      RABBITMQ_PASSWORD_FILE: /run/secrets/rabbitmq_password
      PROMETHEUS_MULTIPROC_DIR: /tmp/worker-metrics
    secrets:
      - rabbitmq_password
    volumes:
      - ../storage:/app/storage
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "celery -A app.ingestion.celery_app:celery_app inspect ping --destination ingestion@$$HOSTNAME --timeout 5 | grep -q pong",
        ]
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: "0.75"
          memory: 384M
        reservations:
          cpus: "0.10"
          memory: 128M

  bale-worker:
    build:
      context: ../backend
    restart: unless-stopped
    command: ["python", "-m", "app.integrations.bale.worker_entrypoint"]
    stop_grace_period: 2m
    env_file:
      - ./.env
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      SERVICE_NAME: bale-worker
      BALE_INTEGRATION_ENABLED: ${BALE_INTEGRATION_ENABLED:-false}
      BALE_CONTENT_UPLOAD_ENABLED: ${BALE_CONTENT_UPLOAD_ENABLED:-false}
      BALE_FILE_UPLOAD_MAX_MB: ${BALE_FILE_UPLOAD_MAX_MB:-20}
      BALE_BOT_TOKEN_FILE: /run/secrets/bale_bot_token
      BALE_INTEGRATION_USER_ID: ${BALE_INTEGRATION_USER_ID:-}
      UPLOAD_STORAGE_PATH: /app/storage/uploads
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-ideation_rag}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-ideation_rag}?ssl=disable
      LOG_DIR: /tmp/ideation-bale-worker-logs
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:?CORS_ALLOWED_ORIGINS is required}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: "5672"
      RABBITMQ_USER: ideation_ingestion
      RABBITMQ_VHOST: ideation
      RABBITMQ_PASSWORD_FILE: /run/secrets/rabbitmq_password
    secrets:
      - rabbitmq_password
      - bale_bot_token
    volumes:
      - ../storage:/app/storage
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "celery -A app.integrations.bale.celery_app:celery_app inspect ping --destination bale@$$HOSTNAME --timeout 5 | grep -q pong",
        ]
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: "0.75"
          memory: 384M
        reservations:
          cpus: "0.10"
          memory: 128M

  frontend:
    build:
      context: ../frontend
      args:
        NEXT_PUBLIC_API_BASE_URL: /api/v1
    restart: unless-stopped
    depends_on:
      - backend

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "4000:80"
      - "18090:80"
      - "18443:443"
    volumes:
      - ../nginx/conf.d/ideation-rag.prod.conf:/etc/nginx/conf.d/default.conf:ro
      - ../nginx/ssl:/etc/nginx/ssl:ro
      - ../storage/nginx-cache:/var/cache/nginx
    depends_on:
      frontend:
        condition: service_started
      backend:
        condition: service_healthy

  prometheus:
    image: ghcr.io/prometheus/prometheus:v3.5.5
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=10d
      - --storage.tsdb.retention.size=2GB
      - --web.enable-lifecycle
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/rules:/etc/prometheus/rules:ro
      - prometheus_data:/prometheus
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:9090/-/healthy"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 256M
        reservations:
          cpus: "0.05"
          memory: 64M

volumes:
  postgres_data:
  prometheus_data:
  rabbitmq_data:

secrets:
  rabbitmq_password:
    file: /var/lib/ideation-secrets/rabbitmq_password
  bale_bot_token:
    file: /var/lib/ideation-secrets/bale_bot_token
  bale_webhook_secret:
    file: /var/lib/ideation-secrets/bale_webhook_secret
  guest_access_token:
    file: /var/lib/ideation-secrets/guest_access_token
