apiVersion: apps/v1
kind: Deployment
metadata:
  name: core-api
  namespace: application
spec:
  replicas: 2
  selector:
    matchLabels:
      app: core-api
  template:
    metadata:
      labels:
        app: core-api
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
      containers:
      - name: core-api
        image: core-api:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8000
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        securityContext:
          readOnlyRootFilesystem: true
          allowPrivilegeEscalation: false
        volumeMounts:
        - mountPath: /tmp
          name: tmp-volume
        envFrom:
        - secretRef:
            name: core-api-secrets # Managed by External Secrets Operator
      volumes:
      - name: tmp-volume
        emptyDir: {}
