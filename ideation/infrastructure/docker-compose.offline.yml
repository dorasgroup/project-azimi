services:
  postgres:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ideation_rag}
      POSTGRES_USER: ${POSTGRES_USER:-ideation_rag}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ideation_rag} -d ${POSTGRES_DB:-ideation_rag}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    image: ideation-rag-backend:offline
    restart: unless-stopped
    env_file:
      - ./.env
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      ENABLE_PROTOTYPE_ROUTES: "false"
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-ideation_rag}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-ideation_rag}
      LOG_DIR: /app/storage/logs
      UPLOAD_STORAGE_PATH: /app/storage/uploads
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:?CORS_ALLOWED_ORIGINS is required}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8000:8000"
    volumes:
      - ../backend/app:/app/app:ro
      - ../storage:/app/storage
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health/live', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  frontend:
    image: ideation-rag-frontend:offline
    restart: unless-stopped
    depends_on:
      - backend

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "4000:80"
      - "18090:80"
      - "18443:443"
    volumes:
      - ../nginx/conf.d/ideation-rag.prod.conf:/etc/nginx/conf.d/default.conf:ro
      - ../nginx/ssl:/etc/nginx/ssl:ro
      - ../storage/nginx-cache:/var/cache/nginx
    depends_on:
      frontend:
        condition: service_started
      backend:
        condition: service_healthy

volumes:
  postgres_data:
