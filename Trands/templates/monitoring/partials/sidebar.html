{% with current=request.resolver_match.url_name %}
<aside class="app-sidebar" id="app-sidebar" aria-label="ناوبری اصلی">
  <a class="sidebar-brand" href="{% url 'core:home' %}" title="سامانه رصدیار">
    <span class="radar-mark" aria-hidden="true"><i></i></span>
    <strong class="sidebar-brand__title">رصدیار</strong>
  </a>
  <nav class="sidebar-nav">
    <a class="nav-item {% if current == 'home' or current == 'dashboard' %}is-active{% endif %}" href="{% url 'core:home' %}">
      <svg class="nav-icon" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1"></rect><rect x="14" y="3" width="7" height="7" rx="1"></rect><rect x="14" y="14" width="7" height="7" rx="1"></rect><rect x="3" y="14" width="7" height="7" rx="1"></rect></svg>
      <span class="nav-text">داشبورد</span>
    </a>
    <a class="nav-item {% if current == 'run_list' or current == 'run_detail' or current == 'run_delete' %}is-active{% endif %}" href="{% url 'monitoring:run_list' %}">
      <svg class="nav-icon" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg>
      <span class="nav-text">رصد دستی</span>
    </a>
    <a class="nav-item {% if current == 'automation_run_list' or current == 'automation_run_detail' or current == 'settings' %}is-active{% endif %}" href="{% url 'monitoring:automation_run_list' %}">
      <svg class="nav-icon" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="11" width="18" height="10" rx="2"></rect><circle cx="12" cy="5" r="2"></circle><path d="M12 7v4"></path><line x1="8" y1="16" x2="8.01" y2="16"></line><line x1="16" y1="16" x2="16.01" y2="16"></line></svg>
      <span class="nav-text">رصد خودکار</span>
    </a>
    <a class="nav-item {% if current == 'topic_list' or current == 'topic_detail' or current == 'topic_create' or current == 'topic_update' or current == 'topic_delete' or current == 'keyword_list' or current == 'keyword_create' or current == 'keyword_update' or current == 'keyword_delete' %}is-active{% endif %}" href="{% url 'monitoring:topic_list' %}">
      <svg class="nav-icon" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20.59 13.41l-7.17 7.17a2 2 0 0 1-2.83 0L2 12V2h10l8.59 8.59a2 2 0 0 1 0 2.82z"></path><line x1="7" y1="7" x2="7.01" y2="7"></line></svg>
      <span class="nav-text">موضوع‌ها و کلیدواژه‌ها</span>
    </a>
    <a class="nav-item {% if current == 'source_list' %}is-active{% endif %}" href="{% url 'monitoring:source_list' %}">
      <svg class="nav-icon" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><ellipse cx="12" cy="5" rx="9" ry="3"></ellipse><path d="M21 12c0 1.66-4 3-9 3s-9-1.34-9-3"></path><path d="M3 5v14c0 1.66 4 3 9 3s9-1.34 9-3V5"></path></svg>
      <span class="nav-text">منابع</span>
    </a>
    <a class="nav-item {% if current == 'delivery_list' or current == 'delivery_detail' or current == 'bale_destination_list' or current == 'bale_destination_create' or current == 'bale_destination_update' or current == 'bale_token_update' or current == 'bale_bot_check' %}is-active{% endif %}" href="{% url 'monitoring:delivery_list' %}">
      <svg class="nav-icon" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
      <span class="nav-text">پیام‌رسان بله</span>
    </a>
    <a class="nav-item {% if current == 'idea_delivery_list' or current == 'idea_delivery_retry' %}is-active{% endif %}" href="{% url 'monitoring:idea_delivery_list' %}">
      <svg class="nav-icon" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="6" height="6" rx="1"></rect><rect x="15" y="14" width="6" height="6" rx="1"></rect><path d="M9 7h4a4 4 0 0 1 4 4v3"></path><polyline points="14 12 17 15 20 12"></polyline></svg>
      <span class="nav-text">ارسال به سامانه ایده‌پردازی</span>
    </a>
  </nav>
</aside>
{% endwith %}
