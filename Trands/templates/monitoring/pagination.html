{% if is_paginated %}<nav aria-label="صفحه‌بندی"><ul class="pagination">{% if page_obj.has_previous %}<li class="page-item"><a class="page-link" href="{% querystring page=page_obj.previous_page_number %}">قبلی</a></li>{% endif %}<li class="page-item disabled"><span class="page-link">صفحه {{ page_obj.number }} از {{ paginator.num_pages }}</span></li>{% if page_obj.has_next %}<li class="page-item"><a class="page-link" href="{% querystring page=page_obj.next_page_number %}">بعدی</a></li>{% endif %}</ul></nav>{% endif %}
