name: rasad-analysis

services:
  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile.dev
    environment:
      VITE_API_URL: http://localhost:${API_PORT:-8010}
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    volumes:
      - ../frontend:/app
      - frontend_node_modules:/app/node_modules
    depends_on:
      api:
        condition: service_healthy

  api:
    build:
      context: ../backend
      target: runtime
      args:
        GIT_SHA: ${GIT_SHA:-unknown}
        SOURCE_DIGEST: ${SOURCE_DIGEST:-}
        BUILD_TIME: ${BUILD_TIME:-unknown}
        APP_VERSION: ${APP_VERSION:-0.1.0}
        MIGRATION_REVISION: ${MIGRATION_REVISION:-f15a2d74c901}
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    env_file:
      - ../.env
    environment:
      PYTHONPATH: /app
    ports:
      - "${API_PORT:-8010}:8000"
    volumes:
      - ../backend:/app
      - ../docs:/docs:ro
      - ../storage:/storage
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
      rasad-redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health')",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  worker:
    profiles: ["worker"]
    build:
      context: ../backend
      dockerfile: Dockerfile.worker
      args:
        GIT_SHA: ${GIT_SHA:-unknown}
        SOURCE_DIGEST: ${SOURCE_DIGEST:-}
        BUILD_TIME: ${BUILD_TIME:-unknown}
        APP_VERSION: ${APP_VERSION:-0.1.0}
    command: celery -A app.workers.celery_app:celery_app worker --loglevel=INFO
    env_file:
      - ../.env
    environment:
      PYTHONPATH: /app
      CRAWL_EGRESS_MODE: ${CRAWL_WORKER_EGRESS_MODE:-trusted_proxy}
      CRAWL_PROXY_URL: http://crawler-egress:8080
    volumes:
      - ../backend:/app
      - ../storage:/storage
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
      rasad-redis:
        condition: service_healthy
      crawler-egress:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -m
        - app.workers.healthcheck
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 20s

  test:
    profiles: ["test"]
    build:
      context: ../backend
      target: test
      args:
        GIT_SHA: ${GIT_SHA:-unknown}
        SOURCE_DIGEST: ${SOURCE_DIGEST:-}
        BUILD_TIME: ${BUILD_TIME:-unknown}
        APP_VERSION: ${APP_VERSION:-0.1.0}
    command: pytest -q

  crawler-egress:
    profiles: ["worker"]
    build:
      context: ./crawler-egress
    environment:
      EGRESS_SOCKS_PROXY: ${CRAWL_UPSTREAM_SOCKS_PROXY:-}
    expose:
      - "8080"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:size=16m,noexec,nosuid
    networks:
      - default
    restart: unless-stopped

  postgres:
    image: postgres:15.19-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-rasad}
      POSTGRES_USER: ${POSTGRES_USER:-rasad}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-rasad} -d ${POSTGRES_DB:-rasad}"]
      interval: 5s
      timeout: 5s
      retries: 10

  rasad-redis:
    image: redis:7.4.11-alpine
    command: redis-server --save "" --appendonly no
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  frontend_node_modules:
  postgres_data:
