[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "rasad-analysis-backend"
version = "0.1.0"
description = "Backend and worker for Rasad Analysis"
requires-python = ">=3.12,<3.13"
dependencies = [
  "alembic==1.16.2",
  "celery[redis]==5.5.3",
  "email-validator==2.2.0",
  "defusedxml==0.7.1",
  "fastapi==0.141.1",
  "httpx==0.28.1",
  "jdatetime==5.2.0",
  "json-repair==0.63.4",
  "arabic-reshaper==3.0.0",
  "asyncpg==0.30.0",
  "pydantic-settings==2.10.1",
  "python-bidi==0.6.6",
  "python-docx==1.1.2",
  "reportlab==4.2.5",
  "sqlalchemy==2.0.41",
  "uvicorn[standard]==0.34.3",
  "starlette==1.6.0",
]

[project.optional-dependencies]
dev = [
  "pytest==9.1.1",
  "pytest-asyncio==1.4.0",
  "ruff==0.12.0",
]
worker = [
  "beautifulsoup4==4.14.3",
  "crawl4ai==0.9.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
